name: Test

on:
  pull_request:
    branches:
      - main
      - unicode
  push:
    branches:
      - main
      - ci

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
      - name: Build and test
        run: zig build test

